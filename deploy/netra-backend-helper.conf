# Example systemd drop-in for the unprivileged Netra backend service.
# Replace netra-backend.service with the actual backend unit name.
# Do not install or activate without administrator review.
[Service]
Environment=NETRA_NETWORK_ENFORCEMENT_ENABLED=true
Environment=NETRA_NETWORK_ENFORCEMENT_DRY_RUN=false
Environment=NETRA_NETWORK_ENFORCEMENT_INTERFACE=wlp2s0
Environment=NETRA_NETWORK_ENFORCEMENT_TABLE=netra
Environment=NETRA_NETWORK_ENFORCEMENT_HELPER_SOCKET=/run/netra/network-enforcement.sock
Environment=NETRA_NETWORK_ENFORCEMENT_HELPER_TIMEOUT_SECONDS=3.0
SupplementaryGroups=netra-backend

# The backend must NOT have CAP_NET_ADMIN.
CapabilityBoundingSet=
AmbientCapabilities=
NoNewPrivileges=true
